name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      # softprops/action-gh-release needs contents:write to create a release;
      # the default GITHUB_TOKEN only has contents:read, which is why the first
      # full pipeline run failed with "Resource not accessible by integration".
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskbarFolders.sln

      - name: Build
        run: dotnet build TaskbarFolders.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskbarFolders.sln --configuration Release --no-build

      - name: Publish Manager (self-contained)
        run: dotnet publish src/TaskbarFolders.Manager/TaskbarFolders.Manager.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish/Manager

      - name: Publish Launcher (self-contained)
        run: dotnet publish src/TaskbarFolders.Launcher/TaskbarFolders.Launcher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish/Launcher

      - name: Create portable ZIP
        # The ZIP holds the Manager and Launcher folders only; a portable copy uninstalls through
        # the Manager itself (Settings, or Manager.exe --uninstall).
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./TaskbarFolders-portable.zip

      - name: Build Inno Setup installer
        shell: pwsh
        # Inno Setup 6 is pre-installed on windows-latest runners; using the system iscc
        # avoids depending on third-party GitHub Actions (the previous jrsoftware/iscc-action
        # is no longer published, which is why v0.1.0 and the first v0.2.0 attempt failed).
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc — runner image change suspected; check https://github.com/actions/runner-images for the current Inno Setup install path."
          }
          & $iscc installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # generate_release_notes finds nothing on this repository: releases are cut from
      # direct pushes rather than pull requests, so every release page carried a bare
      # compare link while CHANGELOG.md held the actual prose. Lift the matching section
      # out and use it as the body instead.
      - name: Build release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'
          $lines = Get-Content ./CHANGELOG.md
          # Keep a Changelog headings look like "## [0.4.9] - 2026-09-03"; a literal prefix
          # match is exact here and avoids escaping the brackets into a regex.
          $heading = '## [' + $version + ']'
          $start = $null
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($heading)) { $start = $i + 1; break }
          }

          if ($null -eq $start) {
            Write-Host "::warning::No CHANGELOG section for $version; falling back to generated notes."
            "FOUND=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('## [')) { break }
            $body += $lines[$i]
          }

          $repo = "${{ github.server_url }}/${{ github.repository }}"
          $notes = @()
          $notes += ($body -join "`n").Trim()
          $notes += ''
          $notes += "**Full changelog:** [CHANGELOG.md]($repo/blob/main/CHANGELOG.md)"
          $notes -join "`n" | Set-Content ./RELEASE_NOTES.md -Encoding utf8

          Write-Host "----- release notes -----"
          Get-Content ./RELEASE_NOTES.md
          "FOUND=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          body_path: ${{ steps.notes.outputs.FOUND == 'true' && './RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.FOUND != 'true' }}
          files: |
            ./TaskbarFolders-portable.zip
            ./installer/Output/TaskbarFolders-Setup.exe
